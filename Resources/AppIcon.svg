<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#323a55"/>
      <stop offset="1" stop-color="#0c0e16"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffab4a"/>
      <stop offset="0.5" stop-color="#fff6e3"/>
      <stop offset="1" stop-color="#a9d4ff"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5068"/>
      <stop offset="1" stop-color="#1b1e2b"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#565c75"/>
      <stop offset="0.5" stop-color="#8b91a8"/>
      <stop offset="1" stop-color="#3a3f54"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="glow" x="-60%" y="-80%" width="220%" height="260%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#sq)">
    <!-- Lichtschein -->
    <rect x="232" y="250" width="560" height="360" rx="60" fill="url(#light)" filter="url(#glow)" opacity="0.85"/>
    <!-- Stativ -->
    <rect x="500" y="600" width="24" height="200" fill="url(#pole)"/>
    <rect x="412" y="792" width="200" height="30" rx="15" fill="url(#pole)"/>
    <!-- Panel -->
    <g filter="url(#soft)">
      <rect x="232" y="262" width="560" height="356" rx="54" fill="url(#bezel)"/>
    </g>
    <rect x="256" y="286" width="512" height="308" rx="34" fill="url(#light)"/>
    <rect x="256" y="286" width="512" height="150" rx="34" fill="url(#sheen)"/>
    <!-- Kante oben -->
    <rect x="101.500" y="101.500" width="821" height="821" rx="183.500" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="3"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
